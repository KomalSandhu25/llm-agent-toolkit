[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-agent-toolkit"
version = "0.1.0"
description = "A modular toolkit for building tool-using LLM agents (ReAct, memory, planning)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "openai>=1.30",
    "langchain>=0.2",
    "fastapi>=0.110",
    "redis>=5.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.8", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
strict = true
python_version = "3.10"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
